name: Smart DevOps Assistant CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: false
        default: "staging"

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  continuous-integration:
    name: Real Autonomous CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: 3. Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Install Backend Dependencies
        run: npm --prefix backend ci

      - name: 5. Run Evaluation Suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm --prefix backend test

      - name: 6. Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: 7. Build Frontend Production Bundle
        run: npm --prefix frontend run build

      - name: 8. Validate Docker Compose
        run: docker compose config

      - name: 9. Build and Push Backend Docker Image
        run: |
          docker build \
            -t ghcr.io/dulanilakmali/smart-devops-backend:${{ github.sha }} \
            -t ghcr.io/dulanilakmali/smart-devops-backend:latest \
            ./backend

          docker push ghcr.io/dulanilakmali/smart-devops-backend:${{ github.sha }}
          docker push ghcr.io/dulanilakmali/smart-devops-backend:latest

      - name: 10. Build and Push Frontend Docker Image
        run: |
          docker build \
            -t ghcr.io/dulanilakmali/smart-devops-frontend:${{ github.sha }} \
            -t ghcr.io/dulanilakmali/smart-devops-frontend:latest \
            ./frontend

          docker push ghcr.io/dulanilakmali/smart-devops-frontend:${{ github.sha }}
          docker push ghcr.io/dulanilakmali/smart-devops-frontend:latest

      - name: 11. CI Verification Summary
        run: |
          echo "✅ Real CI pipeline completed successfully."
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Backend: ghcr.io/dulanilakmali/smart-devops-backend:${{ github.sha }}"
          echo "Frontend: ghcr.io/dulanilakmali/smart-devops-frontend:${{ github.sha }}"