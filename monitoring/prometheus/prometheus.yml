global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "smart-devops-assistant"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:5000", "host.docker.internal:5000"]
        labels:
          service: "smart-devops-backend"
          environment: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
